name: Windows desktop release

on:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

concurrency:
  group: windows-release-feed
  queue: max

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content apps/windows/tauri.conf.json | ConvertFrom-Json).version
          node apps/windows/scripts/validate-release.mjs "$env:GITHUB_REF_NAME" "$version"
          if ($LASTEXITCODE -ne 0) { throw "The release tag does not match the Windows app version." }

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.20.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build signed Windows installer and updater artifact
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "Set the TAURI_SIGNING_PRIVATE_KEY repository secret before tagging a Windows release." }
          & ./apps/windows/build.ps1 -Release

      - name: Publish versioned release and update feed
        shell: pwsh
        run: |
          $version = (Get-Content apps/windows/tauri.conf.json | ConvertFrom-Json).version
          $tag = "windows-v$version"
          $latestManifestPath = Join-Path $env:RUNNER_TEMP "windows-latest.json"
          gh release view windows *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release download windows --pattern latest.json --dir $env:RUNNER_TEMP --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not download the current Windows update manifest." }
            if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "latest.json")) {
              Move-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "latest.json") -Destination $latestManifestPath -Force
            }
            node apps/windows/scripts/validate-release.mjs "$env:GITHUB_REF_NAME" "$version" "$latestManifestPath"
            if ($LASTEXITCODE -ne 0) { throw "This release must not replace a newer Windows update feed." }
          }
          $setup = Get-ChildItem "apps/windows/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Windows setup.exe was not produced." }
          $signaturePath = "$($setup.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw "Signed updater setup.exe signature is missing." }
          $publishedAssets = Join-Path $env:RUNNER_TEMP "windows-release-assets"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            New-Item -ItemType Directory -Force -Path $publishedAssets | Out-Null
            gh release download $tag --pattern $setup.Name --dir $publishedAssets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve the immutable installer from the existing release." }
            gh release download $tag --pattern "$($setup.Name).sig" --dir $publishedAssets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve the immutable installer signature from the existing release." }
            $setup = Get-Item -LiteralPath (Join-Path $publishedAssets $setup.Name)
            $signaturePath = "$($setup.FullName).sig"
          } else {
            gh release create $tag $setup.FullName $signaturePath --title "Agent Burn Windows $version" --notes "Windows desktop application release."
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the versioned Windows release assets." }
          }
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$([uri]::EscapeDataString($setup.Name))"
          $manifest = @{
            version = $version
            notes = "Agent Burn Windows $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content -Raw $signaturePath).Trim()
                url = $assetUrl
              }
            }
          } | ConvertTo-Json -Depth 8
          Set-Content -LiteralPath "latest.json" -Value $manifest -Encoding utf8NoBOM
          gh release view windows *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows latest.json --title "Agent Burn Windows update feed" --notes "Rolling signed update manifest for the Windows desktop app."
          } else {
            gh release upload windows latest.json --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not update the Windows update feed." }
