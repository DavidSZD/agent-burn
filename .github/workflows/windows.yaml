name: Windows app
on:
  pull_request:
    paths: ["apps/windows/**", ".github/workflows/windows.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.20.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Agent Burn native CLI
        run: cargo build --manifest-path rust/Cargo.toml --release --bin agent-burn

      - name: Copy native CLI to Windows resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps/windows/resources"
          Copy-Item "rust/target/release/agent-burn.exe" -Destination "apps/windows/resources/agent-burn.exe"

      - name: Verify Windows build script
        shell: pwsh
        run: |
          $required = @(
            "apps/windows/build.ps1",
            "apps/windows/Cargo.toml",
            "apps/windows/tauri.conf.json"
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing required Windows files: $($missing -join ', ')" }

      - name: Test Windows application
        run: cargo test --manifest-path apps/windows/Cargo.toml

      - name: Test Windows UI and release helpers
        run: >-
          node --test apps/windows/ui/ui-utils.test.js
          apps/windows/ui/request-gate.test.js
          apps/windows/ui/update-notice.test.js
          apps/windows/scripts/release-utils.test.mjs

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Package Windows application
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            pnpm --dir apps/windows run build:ui
            if ($LASTEXITCODE -ne 0) { throw "The Windows UI bundle failed to build." }
            pnpm --dir apps/windows exec tauri build --no-bundle
            if ($LASTEXITCODE -ne 0) { throw "The Windows Tauri app failed to build." }
          } else {
            pnpm --dir apps/windows build
            if ($LASTEXITCODE -ne 0) { throw "The Windows release bundle failed to build." }
          }
