name: Windows app
on:
  pull_request:
    paths: ["apps/windows/**", ".github/workflows/windows.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.20.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Agent Burn native CLI
        run: cargo build --manifest-path rust/Cargo.toml --release --bin agent-burn

      - name: Copy native CLI to Windows resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps/windows/resources"
          Copy-Item "rust/target/release/agent-burn.exe" -Destination "apps/windows/resources/agent-burn.exe"

      - name: Verify Windows build script
        shell: pwsh
        run: |
          Test-Path "apps/windows/build.ps1"
          Test-Path "apps/windows/Cargo.toml"
          Test-Path "apps/windows/tauri.conf.json"
